name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches:
      - 'dev'
      - 'master'
    tags:
      - 'v*'
  pull_request:

jobs:
  linux:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          -
            arch: amd64
            runner: ubuntu-24.04
            artifact: innoextract-linux-amd64
            check_style: true
          -
            arch: arm64
            runner: ubuntu-24.04-arm
            artifact: innoextract-linux-arm64
            check_style: false
    steps:
      -
        name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      -
        name: Update
        run: sudo apt-get update
      -
        name: Dependencies
        run: sudo apt-get install build-essential cmake libboost-all-dev liblzma-dev
      -
        name: Configure
        run: cmake --version && cmake -B ${{ github.workspace }}/build -Werror=author -Werror=deprecated -DCONTINUOUS_INTEGRATION=1 -DRUN_TESTS=OFF
      -
        name: Build
        run: cmake --build ${{ github.workspace }}/build
      -
        name: Test
        run: ctest --test-dir ${{ github.workspace }}/build --output-on-failure --timeout 120
      -
        name: Check Style
        if: matrix.check_style
        run: cmake --build ${{ github.workspace }}/build --target style
      -
        name: Install
        run: cmake --install ${{ github.workspace }}/build --prefix ${{ github.workspace }}/dist
      -
        name: Smoke test
        run: |
          "${{ github.workspace }}/dist/bin/innoextract" -h
      -
        name: Prepare release binary
        id: asset
        run: |
          name="${{ matrix.artifact }}"
          mkdir -p release
          cp "${{ github.workspace }}/dist/bin/innoextract" "release/${name}"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
      -
        name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.asset.outputs.name }}
          path: release/${{ steps.asset.outputs.name }}
          if-no-files-found: error

  macos:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          -
            arch: arm64
            runner: macos-15
            artifact: innoextract-darwin-arm64
            cxx_flags: ""
          -
            arch: amd64
            runner: macos-15-intel
            artifact: innoextract-darwin-amd64
            cxx_flags: "-isystem /usr/local/include"
    steps:
      -
        name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      -
        name: Dependencies
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: brew install boost xz
      -
        name: Configure
        env:
          CXXFLAGS: ${{ matrix.cxx_flags }}
        run: cmake --version && cmake -B ${{ github.workspace }}/build -Werror=author -Werror=deprecated -DCONTINUOUS_INTEGRATION=1 -DRUN_TESTS=OFF
      -
        name: Build
        run: cmake --build ${{ github.workspace }}/build
      -
        name: Test
        run: ctest --test-dir ${{ github.workspace }}/build --output-on-failure --timeout 120
      -
        name: Install
        run: cmake --install ${{ github.workspace }}/build --prefix ${{ github.workspace }}/dist
      -
        name: Smoke test
        run: |
          "${{ github.workspace }}/dist/bin/innoextract" -h
      -
        name: Prepare release binary
        id: asset
        run: |
          name="${{ matrix.artifact }}"
          mkdir -p release
          cp "${{ github.workspace }}/dist/bin/innoextract" "release/${name}"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
      -
        name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.asset.outputs.name }}
          path: release/${{ steps.asset.outputs.name }}
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: msys2 {0}
    steps:
      -
        name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      -
        name: Dependencies
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-bzip2
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-xz
            mingw-w64-x86_64-zlib
      -
        name: Configure
        run: cmake --version && cmake -B "${GITHUB_WORKSPACE}/build" -G Ninja -Werror=author -Werror=deprecated -DCONTINUOUS_INTEGRATION=1 -DRUN_TESTS=OFF
      -
        name: Build
        run: cmake --build "${GITHUB_WORKSPACE}/build"
      -
        name: Test
        run: ctest --test-dir "${GITHUB_WORKSPACE}/build" --output-on-failure --timeout 120
      -
        name: Install
        run: cmake --install "${GITHUB_WORKSPACE}/build" --prefix "${GITHUB_WORKSPACE}/dist"
      -
        name: Smoke test
        run: |
          "${GITHUB_WORKSPACE}/dist/bin/innoextract.exe" -h
      -
        name: Prepare release binary
        id: asset
        run: |
          name="innoextract-windows-amd64.exe"
          mkdir -p release
          cp "${GITHUB_WORKSPACE}/dist/bin/innoextract.exe" "release/${name}"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
      -
        name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.asset.outputs.name }}
          path: release/${{ steps.asset.outputs.name }}
          if-no-files-found: error

  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # required to create GitHub release
    needs:
      - linux
      - macos
      - windows
    steps:
      -
        name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: innoextract-*
          path: release
          merge-multiple: true
      -
        name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          files: release/*
