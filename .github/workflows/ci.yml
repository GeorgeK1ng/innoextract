          - compiler: '6.7.0'
            asset: 'innosetup-6.7.0.exe'
            url: 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_0/innosetup-6.7.0.exe'
            sha256: 'f45c7d68d1e660cf13877ec36738a5179ce72a33414f9959d35e99b68c52a697'
