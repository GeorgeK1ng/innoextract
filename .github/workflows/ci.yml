name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches:
      - 'dev'
      - 'master'
    tags:
      - '*'
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      -
        name: Update
        run: sudo apt-get update
      -
        name: Dependencies
        run: sudo apt-get install build-essential cmake libboost-all-dev liblzma-dev
      -
        name: Configure
        run: cmake --version && cmake -B ${{ github.workspace }}/build -Werror=dev -Werror=deprecated -DCONTINUOUS_INTEGRATION=1
      -
        name: Build
        run: cmake --build ${{ github.workspace }}/build
      -
        name: Check Style
        run: cmake --build ${{ github.workspace }}/build --target style
      -
        name: Install
        run: cmake --install ${{ github.workspace }}/build --prefix ${{ github.workspace }}/dist
      -
        name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: innoextract-linux
          path: dist
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      -
        name: Dependencies
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: brew install boost xz
      -
        name: Configure
        run: cmake --version && cmake -B ${{ github.workspace }}/build -Werror=dev -Werror=deprecated -DCONTINUOUS_INTEGRATION=1
      -
        name: Build
        run: cmake --build ${{ github.workspace }}/build
      -
        name: Install
        run: cmake --install ${{ github.workspace }}/build --prefix ${{ github.workspace }}/dist
      -
        name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: innoextract-darwin
          path: dist
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      -
        name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      -
        name: Dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-bzip2
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-xz
            mingw-w64-x86_64-zlib
      -
        name: Configure
        run: cmake --version && cmake -B "${GITHUB_WORKSPACE}/build" -G Ninja -Werror=dev -Werror=deprecated -DCONTINUOUS_INTEGRATION=1
      -
        name: Build
        run: cmake --build "${GITHUB_WORKSPACE}/build"
      -
        name: Install
        run: cmake --install "${GITHUB_WORKSPACE}/build" --prefix "${GITHUB_WORKSPACE}/dist"
      -
        name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: innoextract-windows
          path: dist
          if-no-files-found: error
