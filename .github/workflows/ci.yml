            sha256: '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
            data_version: '6.7.0 (unicode)'
          - compiler: '7.0.0-preview-3'
            asset: 'innosetup-7.0.0-preview-3-x64.exe'
            url: 'https://github.com/jrsoftware/issrc/releases/download/is-7_0_0_2/innosetup-7.0.0-preview-3-x64.exe'
            sha256: 'acbb8e1ff4eb72e29aef1d2b50029e645a433e461d833bb4eb40ed8cc31160a5'
            data_version: '7.0.0.1 (unicode)'
          - compiler: '7.0.0-beta'
            asset: 'innosetup-7.0.0-beta-x64.exe'
            url: 'https://github.com/jrsoftware/issrc/releases/download/is-7_0_0/innosetup-7.0.0-beta-x64.exe'
            sha256: 'bc8e6f13af0f912b5384bbc7068df30cfe3a57bb5f0f5ab3eaa89675629ec797'
            data_version: '7.0.0.3 (unicode)'
          - compiler: '7.0.1-beta'
            asset: 'innosetup-7.0.1-beta-x64.exe'
            url: 'https://github.com/jrsoftware/issrc/releases/download/is-7_0_1/innosetup-7.0.1-beta-x64.exe'
            sha256: 'a6033578da2c7b57ceaf9a97ebba56cb40bb71ed275170b49bbaf5eb1f4b5e16'
            data_version: '7.0.0.3 (unicode)'
          - compiler: '7.0.2'
            asset: 'innosetup-7.0.2-x64.exe'
            url: 'https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe'
            sha256: '5ad54ca3def786f8f4212552e54cc6d8d61329e2d24a1cfee0571d42c2684ff1'
            data_version: '7.0.0.3 (unicode)'
          - compiler: '7.1.0'
            asset: 'innosetup-7.1.0-x64.exe'
            url: 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
            sha256: '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
            data_version: '7.0.0.3 (unicode)'
    steps:
      -
        name: Disable CRLF conversion
        shell: pwsh
        run: git config --global core.autocrlf false
      -
        name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      -
        name: Download and verify Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $downloadDir = Join-Path $env:RUNNER_TEMP 'innosetup-download'
          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
          $installer = Join-Path $downloadDir '${{ matrix.asset }}'
          $url = '${{ matrix.url }}'
          $expected = '${{ matrix.sha256 }}'
          $attempts = 5
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            if (Test-Path -LiteralPath $installer) {
              Remove-Item -LiteralPath $installer -Force
            }
            try {
              Write-Host "Downloading $url (attempt $attempt/$attempts)"
              Invoke-WebRequest -Uri $url -OutFile $installer -TimeoutSec 120
              $actual = (Get-FileHash -Algorithm SHA256 -Path $installer).Hash.ToLowerInvariant()
              if ($actual -ne $expected) {
                throw "SHA-256 mismatch for $url. Expected $expected, got $actual"
              }
              break
            } catch {
              if ($attempt -eq $attempts) {
                throw
              }
              $delay = [Math]::Min(60, 5 * [Math]::Pow(2, $attempt - 1))
              Write-Warning "Download failed: $($_.Exception.Message)"
              Write-Host "Retrying in $delay seconds"
              Start-Sleep -Seconds $delay
            }
          }
          "INNOSETUP_INSTALLER=$installer" >> $env:GITHUB_ENV
      -
        name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:RUNNER_TEMP 'innosetup-${{ matrix.compiler }}'
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          $arguments = @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            "/DIR=$installDir"
          )
          $process = Start-Process -FilePath $env:INNOSETUP_INSTALLER -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installer exited with $($process.ExitCode)"
          }
          $iscc = Join-Path $installDir 'ISCC.exe'
          if (!(Test-Path $iscc)) {
            throw "ISCC.exe was not installed at $iscc"
          }
          "ISCC=$iscc" >> $env:GITHUB_ENV
      -
        name: Compile fixture installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = '${{ matrix.compiler }}'
          $compilerId = $compiler -replace '[^A-Za-z0-9]+', '_'
          $artifactBase = "e2e-$compilerId"
          $artifactName = "$artifactBase.exe"
          $outputDir = Join-Path $env:RUNNER_TEMP 'innosetup-output'
          $artifactDir = Join-Path $env:RUNNER_TEMP 'innosetup-artifact'
          New-Item -ItemType Directory -Force -Path $outputDir, $artifactDir | Out-Null
          $fixture = Join-Path $env:GITHUB_WORKSPACE 'test\e2e\innosetup\fixture.iss'
          & $env:ISCC "/O$outputDir" "/F$artifactBase" $fixture
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $compiledInstaller = Join-Path $outputDir $artifactName
          if (!(Test-Path -LiteralPath $compiledInstaller)) {
            throw "Compiled installer missing: $compiledInstaller"
          }
          Copy-Item -LiteralPath $compiledInstaller -Destination (Join-Path $artifactDir $artifactName)
          $manifest = Join-Path $artifactDir "manifest-$compilerId.tsv"
          $manifestLine = "$compiler`t${{ matrix.data_version }}`t$artifactName`n"
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText($manifest, $manifestLine, $utf8NoBom)
          Get-ChildItem -LiteralPath $artifactDir | Select-Object Name, Length | Format-Table -AutoSize
      -
        name: Upload fixture installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ matrix.compiler }}
          path: ${{ runner.temp }}/innosetup-artifact
          if-no-files-found: error

  validate-artifact:
    name: validate (${{ matrix.artifact }})
    runs-on: ${{ matrix.runner }}
    needs:
      - build-installers
      - build-linux
      - build-macos
      - build-windows
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: innoextract-linux-amd64
          - runner: ubuntu-24.04-arm
            artifact: innoextract-linux-arm64
          - runner: macos-15
            artifact: innoextract-darwin-arm64
          - runner: macos-15-intel
            artifact: innoextract-darwin-amd64
          - runner: windows-2025
            artifact: innoextract-windows-amd64.exe
    steps:
      -
        name: Disable CRLF conversion
        if: startsWith(matrix.runner, 'windows')
        shell: pwsh
        run: git config --global core.autocrlf false
      -
        name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      -
        name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/innoextract-artifact
      -
        name: Download fixture installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-*
          path: ${{ runner.temp }}/e2e-installers
      -
        name: Validate extraction
        shell: bash
        run: |
          to_unix_path() {
            if command -v cygpath >/dev/null 2>&1; then
              cygpath -u "$1"
            else
              printf '%s\n' "$1"
            fi
          }

          temp_dir="$(to_unix_path "${RUNNER_TEMP}")"
          workspace="$(to_unix_path "${GITHUB_WORKSPACE}")"
          artifact_dir="${temp_dir}/innoextract-artifact"
          installers_dir="${temp_dir}/e2e-installers"
          binary="${artifact_dir}/${{ matrix.artifact }}"

          find "${artifact_dir}" "${installers_dir}" -type f -print | sort

          if [ "${RUNNER_OS}" != "Windows" ]; then
            chmod +x "${binary}"
          fi

          bash "${workspace}/test/e2e/innosetup/validate.sh" \
            --innoextract "${binary}" \
            --installers "${installers_dir}"

  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # required to create GitHub release
    needs:
      - validate-artifact
    steps:
      -
        name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: innoextract-*
          path: release
          merge-multiple: true
      -
        name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          files: release/*
