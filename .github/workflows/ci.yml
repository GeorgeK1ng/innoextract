name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - 'dev'
      - 'master'
    tags:
      - 'v*'
  pull_request:

jobs:
  build-linux:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          -
            arch: amd64
            runner: ubuntu-24.04
            artifact: innoextract-linux-amd64
            check_style: true
          -
            arch: arm64
            runner: ubuntu-24.04-arm
            artifact: innoextract-linux-arm64
            check_style: false
    steps:
      -
        name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      -
        name: Update
        run: sudo apt-get update
      -
        name: Dependencies
        run: sudo apt-get install build-essential cmake libboost-all-dev libbz2-dev libicu-dev liblz4-dev liblzma-dev libzstd-dev zlib1g-dev
      -
        name: Configure
        run: cmake --version && cmake -B ${{ github.workspace }}/build -Werror=author -Werror=deprecated -DCONTINUOUS_INTEGRATION=1 -DRUN_TESTS=OFF -DUSE_STATIC_LIBS=ON
      -
        name: Build
        run: cmake --build ${{ github.workspace }}/build
      -
        name: Test
        run: ctest --test-dir ${{ github.workspace }}/build --output-on-failure --timeout 120
      -
        name: Check Style
        if: matrix.check_style
        run: cmake --build ${{ github.workspace }}/build --target style
      -
        name: Install
        run: cmake --install ${{ github.workspace }}/build --prefix ${{ github.workspace }}/dist
      -
        name: Smoke test
        run: |
          "${{ github.workspace }}/dist/bin/innoextract" -h
      -
        name: Prepare release binary
        id: asset
        run: |
          name="${{ matrix.artifact }}"
          mkdir -p release
          cp "${{ github.workspace }}/dist/bin/innoextract" "release/${name}"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
      -
        name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.asset.outputs.name }}
          path: release/${{ steps.asset.outputs.name }}
          if-no-files-found: error

  build-macos:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          -
            arch: arm64
            runner: macos-15
            artifact: innoextract-darwin-arm64
            cxx_flags: ""
          -
            arch: amd64
            runner: macos-15-intel
            artifact: innoextract-darwin-amd64
            cxx_flags: "-isystem /usr/local/include"
    steps:
      -
        name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      -
        name: Dependencies
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: brew install boost bzip2 icu4c@78 libiconv lz4 xz zlib zstd
      -
        name: Configure
        env:
          CXXFLAGS: ${{ matrix.cxx_flags }}
        run: |
          cmake --version
          brew_deps=(boost bzip2 icu4c@78 libiconv lz4 xz zlib zstd)
          prefixes=()
          link_paths=()
          for dep in "${brew_deps[@]}"; do
            prefix="$(brew --prefix "${dep}")"
            prefixes+=("${prefix}")
            link_paths+=("-L${prefix}/lib")
          done
          prefix_path="$(IFS=';'; echo "${prefixes[*]}")"
          link_flags="${link_paths[*]}"
          bzip2_prefix="$(brew --prefix bzip2)"
          iconv_prefix="$(brew --prefix libiconv)"
          xz_prefix="$(brew --prefix xz)"
          zlib_prefix="$(brew --prefix zlib)"
          cmake -B ${{ github.workspace }}/build \
            -Werror=author \
            -Werror=deprecated \
            -DCMAKE_POLICY_DEFAULT_CMP0167=OLD \
            -DBoost_NO_BOOST_CMAKE=ON \
            -DCONTINUOUS_INTEGRATION=1 \
            -DRUN_TESTS=OFF \
            -DUSE_STATIC_LIBS=ON \
            -DCMAKE_PREFIX_PATH="${prefix_path}" \
            -DCMAKE_EXE_LINKER_FLAGS="${link_flags}" \
            -DBZIP2_LIBRARY="${bzip2_prefix}/lib/libbz2.a" \
            -DBZIP2_LIBRARY_RELEASE="${bzip2_prefix}/lib/libbz2.a" \
            -Diconv_INCLUDE_DIR="${iconv_prefix}/include" \
            -Diconv_LIBRARY="${iconv_prefix}/lib/libiconv.a" \
            -DLZMA_LIBRARY="${xz_prefix}/lib/liblzma.a" \
            -DZLIB_LIBRARY="${zlib_prefix}/lib/libz.a" \
            -DZLIB_LIBRARY_RELEASE="${zlib_prefix}/lib/libz.a"
      -
        name: Build
        run: cmake --build ${{ github.workspace }}/build
      -
        name: Test
        run: ctest --test-dir ${{ github.workspace }}/build --output-on-failure --timeout 120
      -
        name: Install
        run: cmake --install ${{ github.workspace }}/build --prefix ${{ github.workspace }}/dist
      -
        name: Smoke test
        run: |
          "${{ github.workspace }}/dist/bin/innoextract" -h
      -
        name: Prepare release binary
        id: asset
        run: |
          name="${{ matrix.artifact }}"
          mkdir -p release
          cp "${{ github.workspace }}/dist/bin/innoextract" "release/${name}"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
      -
        name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.asset.outputs.name }}
          path: release/${{ steps.asset.outputs.name }}
          if-no-files-found: error

  build-windows:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: msys2 {0}
    steps:
      -
        name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      -
        name: Dependencies
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-bzip2
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-xz
            mingw-w64-x86_64-zlib
      -
        name: Configure
        run: cmake --version && cmake -B "${GITHUB_WORKSPACE}/build" -G Ninja -Werror=author -Werror=deprecated -DCONTINUOUS_INTEGRATION=1 -DRUN_TESTS=OFF
      -
        name: Build
        run: cmake --build "${GITHUB_WORKSPACE}/build"
      -
        name: Test
        run: ctest --test-dir "${GITHUB_WORKSPACE}/build" --output-on-failure --timeout 120
      -
        name: Install
        run: cmake --install "${GITHUB_WORKSPACE}/build" --prefix "${GITHUB_WORKSPACE}/dist"
      -
        name: Smoke test
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & "${env:GITHUB_WORKSPACE}\dist\bin\innoextract.exe" -h
      -
        name: Prepare release binary
        id: asset
        run: |
          name="innoextract-windows-amd64.exe"
          mkdir -p release
          cp "${GITHUB_WORKSPACE}/dist/bin/innoextract.exe" "release/${name}"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
      -
        name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.asset.outputs.name }}
          path: release/${{ steps.asset.outputs.name }}
          if-no-files-found: error

  build-windows-x86:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      -
        name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      -
        name: Dependencies
        shell: pwsh
        run: |
          & "${env:VCPKG_INSTALLATION_ROOT}/vcpkg.exe" install `
          boost-iostreams `
          boost-filesystem `
          boost-date-time `
          boost-program-options `
          bzip2 `
          liblzma `
          zlib `
          --triplet x86-windows-static
      -
        name: Configure
        shell: pwsh
        run: |
          cmake --version
          cmake -B "${env:GITHUB_WORKSPACE}/build" `
            -G "Visual Studio 17 2022" `
            -A Win32 `
            -Werror=author `
            -Werror=deprecated `
            -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x86-windows-static `
            -DCONTINUOUS_INTEGRATION=1 `
            -DRUN_TESTS=OFF
      -
        name: Build
        shell: pwsh
        run: cmake --build "${env:GITHUB_WORKSPACE}/build" --config Release
      -
        name: Test
        shell: pwsh
        run: ctest --test-dir "${env:GITHUB_WORKSPACE}/build" -C Release --output-on-failure --timeout 120
      -
        name: Install
        shell: pwsh
        run: cmake --install "${env:GITHUB_WORKSPACE}/build" --config Release --prefix "${env:GITHUB_WORKSPACE}/dist"
      -
        name: Smoke test
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & "${env:GITHUB_WORKSPACE}\dist\bin\innoextract.exe" -h
      -
        name: Prepare release binary
        id: asset
        shell: pwsh
        run: |
          $name = 'innoextract-windows-x86.exe'
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "${env:GITHUB_WORKSPACE}/dist/bin/innoextract.exe" "release/$name"
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      -
        name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.asset.outputs.name }}
          path: release/${{ steps.asset.outputs.name }}
          if-no-files-found: error

  build-installers:
    name: build-installers (${{ matrix.compiler }})
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: '6.0.5'
            asset: 'innosetup-6.0.5.exe'
            url: 'https://github.com/jrsoftware/issrc/releases/download/is-6_0_5/innosetup-6.0.5.exe'
