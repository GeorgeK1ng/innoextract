            sha256: '0bcb2a409dea17e305a27a6b09555cabe600e984f88570ab72575cd7e93c95e6'
            data_version: '6.3.0 (unicode)'
          - compiler: '6.4.0'
            asset: 'innosetup-6.4.0.exe'
            url: 'https://github.com/jrsoftware/issrc/releases/download/is-6_4_0/innosetup-6.4.0.exe'
            sha256: 'a360db165cfb1d42d195b020700181e7eaf5db45c1249a24edb51c3c33e9d659'
            data_version: '6.4.0.1 (unicode)'
          - compiler: '6.4.2'
            asset: 'innosetup-6.4.2.exe'
            url: 'https://github.com/jrsoftware/issrc/releases/download/is-6_4_2/innosetup-6.4.2.exe'
            sha256: '238e2cf82c212a3879a050e02d787283c54bcb72d5cb6070830942de56627d5b'
