          - compiler: '6.4.3'
            asset: 'innosetup-6.4.3.exe'
            url: 'https://github.com/jrsoftware/issrc/releases/download/is-6_4_3/innosetup-6.4.3.exe'
            sha256: 'f3c42116542c4cc57263c5ba6c4feabfc49fe771f2f98a79d2f7628b8762723b'
            data_version: '6.4.3 (unicode)'
          - compiler: '6.5.0'
            asset: 'innosetup-6.5.0.exe'
            url: 'https://github.com/jrsoftware/issrc/releases/download/is-6_5_0/innosetup-6.5.0.exe'
            sha256: '79b7a1063b3888bb8eceb44a8c28e90ccdaa22ac71f9272de1dac79b42941dbd'
            data_version: '6.5.0 (unicode)'
          - compiler: '6.5.1'
            asset: 'innosetup-6.5.1.exe'
            url: 'https://github.com/jrsoftware/issrc/releases/download/is-6_5_1/innosetup-6.5.1.exe'
            sha256: '3622ffdad7b2534239370099149c33adb85b90054799d901cb8ec844df7a0e41'
            data_version: '6.5.0 (unicode)'
          - compiler: '6.5.2'
            asset: 'innosetup-6.5.2.exe'
            url: 'https://github.com/jrsoftware/issrc/releases/download/is-6_5_2/innosetup-6.5.2.exe'
            sha256: '8582879760b6e0e42e00f2e28ce904afac0d739941a130d3da3573c3cbf2d75b'
