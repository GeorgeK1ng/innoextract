name: e2e

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - 'dev'
      - 'master'
  pull_request:

jobs:
  build-installers:
    name: ${{ matrix.compiler }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: '5.6.1'
            asset: 'innosetup-5.6.1-unicode.exe'
            url: 'https://files.jrsoftware.org/is/5/innosetup-5.6.1-unicode.exe'
            sha256: '27d49e9bc769e9d1b214c153011978db90dc01c2acd1ddcd9ed7b3fe3b96b538'
            data_version: '5.5.7 (unicode)'
          - compiler: '6.0.5'
            asset: 'innosetup-6.0.5.exe'
            url: 'https://github.com/jrsoftware/issrc/releases/download/is-6_0_5/innosetup-6.0.5.exe'
            sha256: 'ae6823b523df87e9441789e51845434e4e0e70aac0b88afe80f94f20f4b98acb'
            data_version: '6.0.0 (unicode)'
          - compiler: '6.1.2'
            asset: 'innosetup-6.1.2.exe'
            url: 'https://github.com/jrsoftware/issrc/releases/download/is-6_1_2/innosetup-6.1.2.exe'
            sha256: 'a3ce1c40ef9c71a92691aaff0f413f530c8c9e3c766be481bc63ca7cc74e35e7'
            data_version: '6.1.0 (unicode)'
          - compiler: '6.3.3'
            asset: 'innosetup-6.3.3.exe'
            url: 'https://github.com/jrsoftware/issrc/releases/download/is-6_3_3/innosetup-6.3.3.exe'
            sha256: '0bcb2a409dea17e305a27a6b09555cabe600e984f88570ab72575cd7e93c95e6'
            data_version: '6.3.0 (unicode)'
          - compiler: '6.4.0'
            asset: 'innosetup-6.4.0.exe'
            url: 'https://github.com/jrsoftware/issrc/releases/download/is-6_4_0/innosetup-6.4.0.exe'
            sha256: 'a360db165cfb1d42d195b020700181e7eaf5db45c1249a24edb51c3c33e9d659'
            data_version: '6.4.0.1 (unicode)'
    steps:
      -
        name: Disable CRLF conversion
        shell: pwsh
        run: git config --global core.autocrlf false
      -
        name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      -
        name: Download and verify Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $downloadDir = Join-Path $env:RUNNER_TEMP 'innosetup-download'
          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
          $installer = Join-Path $downloadDir '${{ matrix.asset }}'
          $url = '${{ matrix.url }}'
          $expected = '${{ matrix.sha256 }}'
          $attempts = 5
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            if (Test-Path -LiteralPath $installer) {
              Remove-Item -LiteralPath $installer -Force
            }
            try {
              Write-Host "Downloading $url (attempt $attempt/$attempts)"
              Invoke-WebRequest -Uri $url -OutFile $installer -TimeoutSec 120
              $actual = (Get-FileHash -Algorithm SHA256 -Path $installer).Hash.ToLowerInvariant()
              if ($actual -ne $expected) {
                throw "SHA-256 mismatch for $url. Expected $expected, got $actual"
              }
              break
            } catch {
              if ($attempt -eq $attempts) {
                throw
              }
              $delay = [Math]::Min(60, 5 * [Math]::Pow(2, $attempt - 1))
              Write-Warning "Download failed: $($_.Exception.Message)"
              Write-Host "Retrying in $delay seconds"
              Start-Sleep -Seconds $delay
            }
          }
          "INNOSETUP_INSTALLER=$installer" >> $env:GITHUB_ENV
      -
        name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:RUNNER_TEMP 'innosetup-${{ matrix.compiler }}'
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          $arguments = @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            "/DIR=$installDir"
          )
          $process = Start-Process -FilePath $env:INNOSETUP_INSTALLER -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installer exited with $($process.ExitCode)"
          }
          $iscc = Join-Path $installDir 'ISCC.exe'
          if (!(Test-Path $iscc)) {
            throw "ISCC.exe was not installed at $iscc"
          }
          "ISCC=$iscc" >> $env:GITHUB_ENV
      -
        name: Compile fixture installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = '${{ matrix.compiler }}'
          $compilerId = $compiler -replace '[^A-Za-z0-9]+', '_'
          $artifactBase = "e2e-$compilerId"
          $artifactName = "$artifactBase.exe"
          $outputDir = Join-Path $env:RUNNER_TEMP 'innosetup-output'
          $artifactDir = Join-Path $env:RUNNER_TEMP 'innosetup-artifact'
          New-Item -ItemType Directory -Force -Path $outputDir, $artifactDir | Out-Null
          $fixture = Join-Path $env:GITHUB_WORKSPACE 'test\e2e\innosetup\fixture.iss'
          & $env:ISCC "/O$outputDir" "/F$artifactBase" $fixture
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $compiledInstaller = Join-Path $outputDir $artifactName
          if (!(Test-Path -LiteralPath $compiledInstaller)) {
            throw "Compiled installer missing: $compiledInstaller"
          }
          Copy-Item -LiteralPath $compiledInstaller -Destination (Join-Path $artifactDir $artifactName)
          $manifest = Join-Path $artifactDir "manifest-$compilerId.tsv"
          $manifestLine = "$compiler`t${{ matrix.data_version }}`t$artifactName`n"
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText($manifest, $manifestLine, $utf8NoBom)
          Get-ChildItem -LiteralPath $artifactDir | Select-Object Name, Length | Format-Table -AutoSize
      -
        name: Upload fixture installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ matrix.compiler }}
          path: ${{ runner.temp }}/innosetup-artifact
          if-no-files-found: error

  validate-installers:
    runs-on: ubuntu-latest
    needs:
      - build-installers
    timeout-minutes: 20
    steps:
      -
        name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      -
        name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libboost-all-dev liblzma-dev
      -
        name: Configure
        run: cmake --version && cmake -B "${{ github.workspace }}/build" -Werror=author -Werror=deprecated -DCONTINUOUS_INTEGRATION=1 -DRUN_TESTS=OFF
      -
        name: Build innoextract
        run: cmake --build "${{ github.workspace }}/build" --target innoextract
      -
        name: Download fixture installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-*
          path: ${{ github.workspace }}/e2e-installers
      -
        name: List downloaded artifacts
        run: find "${{ github.workspace }}/e2e-installers" -type f -print | sort
      -
        name: Validate extraction
        run: |
          bash test/e2e/innosetup/validate.sh \
            --innoextract "${{ github.workspace }}/build/innoextract" \
            --installers "${{ github.workspace }}/e2e-installers"
